name: Refresh scoreboard data

on:
  schedule:
    # GitHub schedules use UTC. Run every six hours.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Import even when the upstream commit has not changed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: refresh-scoreboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Check upstream data revision
        id: upstream
        shell: bash
        env:
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          current_sha="$(git -C lc-score-board rev-parse HEAD)"
          git -C lc-score-board fetch --quiet origin gh-pages
          latest_sha="$(git -C lc-score-board rev-parse FETCH_HEAD)"

          if [[ "$current_sha" != "$latest_sha" || "$FORCE_REFRESH" == "true" ]]; then
            git -C lc-score-board checkout --quiet --detach "$latest_sha"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Refreshing data: $current_sha -> $latest_sha"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream data is already current at $current_sha"
          fi

      - name: Set up Python
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-data-import.txt

      - name: Install snapshot dependency
        if: steps.upstream.outputs.changed == 'true'
        run: python -m pip install "openpyxl>=3.1,<4"

      - name: Build and validate snapshot
        if: steps.upstream.outputs.changed == 'true'
        run: npm run data:snapshot

      - name: Set up Node.js
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install importer dependencies
        if: steps.upstream.outputs.changed == 'true'
        run: npm ci

      - name: Import into Supabase
        if: steps.upstream.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run data:import

      - name: Record successfully imported revision
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lc-score-board data/leaderboard.json

          if git diff --cached --quiet; then
            echo "No repository files changed (forced import only)."
          else
            upstream_sha="$(git -C lc-score-board rev-parse --short=12 HEAD)"
            git commit -m "chore(data): refresh scoreboard from $upstream_sha"
            git push
          fi
