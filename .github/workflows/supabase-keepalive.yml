name: Supabase keepalive

# Free Supabase projects pause after about a week without activity. The scoreboard
# refresh skips Supabase when upstream data is unchanged, so query it once a day.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            "$SUPABASE_URL/rest/v1/users?select=id&limit=1" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" > /dev/null
          echo "Supabase responded."
